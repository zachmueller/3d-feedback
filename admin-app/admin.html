<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Projects · 3D models</title>
  <link rel="stylesheet" href="/app/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">3D models</div>
    <nav>
      <a href="#feedback">Feedback</a>
      <a href="#" id="logout">Sign out</a>
    </nav>
  </header>

  <main>
    <div class="row">
      <div>
        <h1>Projects</h1>
        <p class="subtitle">
          Publish new revisions from the CLI with <code>tools/publish.sh</code>.
          Every revision keeps its own link and its own feedback.
        </p>
      </div>
      <div class="spacer"></div>
      <button id="refresh" class="btn secondary small">Refresh</button>
    </div>

    <div id="status" class="status"></div>

    <div id="projects" class="stack"></div>
    <div id="empty" class="empty hidden">
      No projects yet. Publish one with <code>tools/publish.sh model.glb --project my-part</code>.
    </div>
    <div id="loading" class="empty"><span class="spinner"></span> Loading…</div>
    <div id="projectsMore" class="more hidden">
      <span id="projectsCount" class="meta"></span>
      <button class="btn secondary small" data-act="more-projects">Load more</button>
    </div>

    <section id="feedback">
      <div class="row">
        <h2>Recent feedback</h2>
        <div class="spacer"></div>
        <button id="refreshFeedback" class="btn secondary small">Refresh</button>
      </div>
      <div id="feedbackList" class="stack"></div>
      <div id="feedbackEmpty" class="empty hidden">No feedback yet.</div>
      <div id="feedbackMore" class="more hidden">
        <span id="feedbackCount" class="meta"></span>
        <button class="btn secondary small" data-act="more-feedback">Load more</button>
      </div>
    </section>
  </main>

  <script type="module">
    import {
      requireAuth, api, getConfig, shareUrl, logout, canonicalizeOrigin, startTokenRefresh,
      el, setStatus, copyText, escapeHtml, fmtDate,
    } from '/app/app.js';

    const projectsNode = el('projects');
    const statusNode = el('status');
    const emptyNode = el('empty');
    const loadingNode = el('loading');
    const feedbackNode = el('feedbackList');
    const feedbackEmpty = el('feedbackEmpty');

    let cfg;

    // Both lists are paged: the first load is one page, and "Load more" appends.
    // Nothing here asks for everything, so the page stays the same size to load
    // whether there are five projects or five hundred.
    const PROJECT_PAGE = 20;
    const FEEDBACK_PAGE = 25;
    // Matches MAX_REVISION_LIMIT in the handler: what "Show all" asks for.
    const ALL_REVISIONS = 500;

    const projectPage = { loaded: 0, total: 0 };
    const feedbackPage = { loaded: 0, total: 0 };

    el('logout').addEventListener('click', (e) => { e.preventDefault(); logout(); });
    el('refresh').addEventListener('click', () => loadProjects());
    el('refreshFeedback').addEventListener('click', () => loadFeedback());

    function fmtBytes(n) {
      if (!n) return '';
      return n >= 1048576 ? `${(n / 1048576).toFixed(1)} MB` : `${Math.round(n / 1024)} KB`;
    }

    function statusPill(rev) {
      if (rev.status === 'ready') return '';
      const kind = rev.status === 'error' ? 'err' : 'warn';
      const title = rev.error ? ` title="${escapeHtml(rev.error)}"` : '';
      return ` <span class="pill ${kind}"${title}>${escapeHtml(rev.status)}</span>`;
    }

    // Provenance is shown here but never edited: it is a mechanical claim about
    // bytes that are immutable, so a hand-typed correction would be an assertion
    // nobody could check against the model. The remedy for a wrong one is a new
    // revision, the same as for wrong geometry. Notes and the title stay editable
    // because they are prose, meant to be revised.
    function sourceLine(rev) {
      const s = rev.source;
      if (!s) return '';
      const where = [s.repo, s.path].filter(Boolean).join('/');
      const parts = [
        where,
        s.commit ? s.commit.slice(0, 12) : '',
        s.dirty ? 'dirty' : '',
        s.build || '',
      ].filter(Boolean);
      if (!parts.length) return '';
      const full = s.recreate || parts.join(' · ');
      return `<div class="meta mono" title="${escapeHtml(full)}">built from ${escapeHtml(parts.join(' · '))}</div>`;
    }

    function revisionRow(project, rev) {
      const url = shareUrl(cfg, project.slug, rev.rev);
      // A revision that never finished processing has no page to link to.
      const link = rev.status === 'ready'
        ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener" class="mono">/${escapeHtml(project.slug)}/${rev.rev}</a>`
        : `<span class="mono muted">/${escapeHtml(project.slug)}/${rev.rev}</span>`;
      const comments = rev.commentCount
        ? `<span class="pill">${rev.commentCount} comment${rev.commentCount === 1 ? '' : 's'}</span>`
        : '';
      return `<li>
        <div class="revhead">
          <strong>Rev ${rev.rev}</strong>${statusPill(rev)}
          ${link}
          <span class="spacer"></span>
          ${comments}
          <button class="btn tiny secondary" data-act="copy" data-url="${escapeHtml(url)}">Copy</button>
          <button class="btn tiny secondary" data-act="notes" data-slug="${escapeHtml(project.slug)}" data-rev="${rev.rev}">Notes</button>
          <button class="btn tiny danger" data-act="del-rev" data-slug="${escapeHtml(project.slug)}" data-rev="${rev.rev}">Delete</button>
        </div>
        <div class="note">${escapeHtml(rev.notes || 'No notes.')}</div>
        <div class="meta mono">${escapeHtml(fmtDate(rev.publishedAt || rev.reservedAt))} · ${escapeHtml(fmtBytes(rev.bytes))}</div>
        ${sourceLine(rev)}
      </li>`;
    }

    /**
     * The revision list, plus what it is a window onto. `revisionCount` is every
     * revision the project has; only the newest few come down with the page, so a
     * long-running project does not make this page expensive to load.
     */
    function revisionList(project) {
      const shown = project.revisions.length;
      const total = project.revisionCount ?? shown;
      const rows = project.revisions.map((r) => revisionRow(project, r)).join('');
      const label = total === shown
        ? `${total} revision${total === 1 ? '' : 's'}`
        : `${shown} of ${total} revisions`;
      const showAll = total > shown
        ? `<button class="btn tiny secondary" data-act="all-revs" data-slug="${escapeHtml(project.slug)}">Show all ${total}</button>`
        : '';
      return `<details${total <= 3 ? ' open' : ''} data-project="${escapeHtml(project.slug)}">
          <summary>${label}</summary>
          <ul class="revs">${rows}</ul>
          ${showAll ? `<div class="more">${showAll}</div>` : ''}
        </details>`;
    }

    function projectCard(project) {
      const latestUrl = shareUrl(cfg, project.slug);
      const count = project.revisionCount ?? project.revisions.length;
      return `<div class="card" data-card="${escapeHtml(project.slug)}">
        <div class="row">
          <div>
            <div class="title">${escapeHtml(project.title || project.slug)}</div>
            <div class="meta mono">${escapeHtml(project.slug)} · ${count} revision${count === 1 ? '' : 's'}${
              project.latest ? ` · latest is rev ${project.latest}` : ' · nothing published'
            }</div>
          </div>
          <div class="spacer"></div>
          <a class="btn tiny secondary" href="${escapeHtml(latestUrl)}" target="_blank" rel="noopener">Open latest</a>
          <button class="btn tiny secondary" data-act="copy" data-url="${escapeHtml(latestUrl)}">Copy</button>
          <button class="btn tiny secondary" data-act="title" data-slug="${escapeHtml(project.slug)}">Rename</button>
          <button class="btn tiny danger" data-act="del-project" data-slug="${escapeHtml(project.slug)}">Delete all</button>
        </div>
        ${revisionList(project)}
      </div>`;
    }

    /** Show "20 of 63" and the Load more button, or hide the row when done. */
    function updateMore(node, countNode, page, noun) {
      const done = page.loaded >= page.total;
      node.classList.toggle('hidden', done);
      countNode.textContent = done ? '' : `Showing ${page.loaded} of ${page.total} ${noun}`;
    }

    /**
     * One page of projects. `append` adds the next page instead of replacing the
     * list, so "Load more" does not re-render (or re-fetch) what is already there.
     */
    async function loadProjects({ append = false } = {}) {
      loadingNode.classList.remove('hidden');
      try {
        // A reload after an edit keeps however many pages were open, so the view
        // does not snap back to the first page under the user.
        const offset = append ? projectPage.loaded : 0;
        const limit = append
          ? PROJECT_PAGE
          : Math.max(PROJECT_PAGE, projectPage.loaded || PROJECT_PAGE);
        const { projects, total } = await api('list', { offset, limit });
        loadingNode.classList.add('hidden');

        if (append) {
          projectsNode.insertAdjacentHTML('beforeend', projects.map(projectCard).join(''));
          projectPage.loaded += projects.length;
        } else {
          projectsNode.innerHTML = projects.map(projectCard).join('');
          projectPage.loaded = projects.length;
        }
        projectPage.total = total;
        emptyNode.classList.toggle('hidden', projectPage.total > 0);
        updateMore(el('projectsMore'), el('projectsCount'), projectPage, 'projects');
      } catch (err) {
        loadingNode.classList.add('hidden');
        setStatus(statusNode, 'err', escapeHtml(err.message || String(err)));
      }
    }

    function commentCard(c) {
      return `
          <div class="card comment">
            <div class="revhead">
              <strong>${escapeHtml(c.name || 'Anonymous')}</strong>
              <span class="meta">${escapeHtml(fmtDate(c.at))}</span>
              <span class="spacer"></span>
              <a href="${escapeHtml(c.url)}" target="_blank" rel="noopener" class="mono">/${escapeHtml(c.project)}/${c.revision}</a>
            </div>
            <div class="ctext">${escapeHtml(c.text)}</div>
          </div>`;
    }

    /**
     * One page of feedback. The page is counted in *revision threads*, not
     * comments — that is what lets the API read only a page's worth of threads
     * instead of every thread on every load — so a page can bring back more
     * comments than the page size.
     */
    async function loadFeedback({ append = false } = {}) {
      try {
        const offset = append ? feedbackPage.loaded : 0;
        const limit = append
          ? FEEDBACK_PAGE
          : Math.max(FEEDBACK_PAGE, feedbackPage.loaded || FEEDBACK_PAGE);
        const { items, total, limit: served } = await api('feedback', { offset, limit });
        // Threads consumed, which is what `total` counts — not items rendered.
        const consumed = Math.min(served, Math.max(total - offset, 0));

        if (append) {
          feedbackNode.insertAdjacentHTML('beforeend', items.map(commentCard).join(''));
          feedbackPage.loaded += consumed;
        } else {
          feedbackNode.innerHTML = items.map(commentCard).join('');
          feedbackPage.loaded = consumed;
        }
        feedbackPage.total = total;
        feedbackEmpty.classList.toggle('hidden', total > 0);
        updateMore(el('feedbackMore'), el('feedbackCount'), feedbackPage, 'threads');
      } catch (err) {
        setStatus(statusNode, 'err', escapeHtml(err.message || String(err)));
      }
    }

    // One delegated handler for every button in both lists.
    document.addEventListener('click', async (event) => {
      const button = event.target.closest('[data-act]');
      if (!button) return;
      const { act, slug, rev, url } = button.dataset;

      try {
        if (act === 'copy') {
          const ok = await copyText(url);
          const original = button.textContent;
          button.textContent = ok ? 'Copied!' : 'Copy failed';
          setTimeout(() => { button.textContent = original; }, 1500);
          return;
        }
        if (act === 'more-projects') {
          button.disabled = true;
          try { await loadProjects({ append: true }); } finally { button.disabled = false; }
          return;
        }
        if (act === 'more-feedback') {
          button.disabled = true;
          try { await loadFeedback({ append: true }); } finally { button.disabled = false; }
          return;
        }
        if (act === 'all-revs') {
          // Fetch this one project's full revision list and swap only its card,
          // leaving the rest of the page — and the other cards' windows — alone.
          button.disabled = true;
          try {
            const { projects } = await api('list', { project: slug, revisionLimit: ALL_REVISIONS });
            const card = projectsNode.querySelector(`[data-card="${CSS.escape(slug)}"]`);
            const details = card?.querySelector('details');
            if (projects[0] && details) {
              details.outerHTML = revisionList(projects[0]);
              card.querySelector('details').open = true;
            }
          } finally {
            // The button is gone once the swap succeeds; re-enable it if it isn't,
            // so a failed fetch leaves something to click again.
            if (button.isConnected) button.disabled = false;
          }
          return;
        }
        if (act === 'title') {
          const title = prompt(`Title for "${slug}"`);
          if (title === null) return;
          await api('edit', { project: slug, title });
          await loadProjects();
          return;
        }
        if (act === 'notes') {
          const notes = prompt(`Notes for ${slug} rev ${rev}`);
          if (notes === null) return;
          await api('edit', { project: slug, revision: Number(rev), notes });
          await loadProjects();
          return;
        }
        if (act === 'del-rev') {
          if (!confirm(`Delete ${slug} rev ${rev}? Its link and feedback go away for good.`)) return;
          await api('delete', { project: slug, revision: Number(rev) });
          setStatus(statusNode, 'ok', `Deleted ${escapeHtml(slug)} rev ${escapeHtml(rev)}.`);
          await loadProjects();
          return;
        }
        if (act === 'del-project') {
          if (!confirm(`Delete the whole "${slug}" project — every revision and all feedback?`)) return;
          await api('delete', { project: slug });
          setStatus(statusNode, 'ok', `Deleted ${escapeHtml(slug)}.`);
          await Promise.all([loadProjects(), loadFeedback()]);
          return;
        }
      } catch (err) {
        setStatus(statusNode, 'err', escapeHtml(err.message || String(err)));
      }
    });

    (async () => {
      // One origin, one token store — before requireAuth, or a signed-in user
      // arriving on the CloudFront domain gets sent through a needless sign-in.
      if (await canonicalizeOrigin()) return;
      await requireAuth();
      cfg = await getConfig();
      // Keep the token fresh while this tab is open, so coming back to a page
      // left open overnight is not the moment a refresh turns out to be needed.
      startTokenRefresh();
      await Promise.all([loadProjects(), loadFeedback()]);
    })().catch((err) => {
      // requireAuth rejects on purpose after starting the redirect to /login;
      // swallowing it here keeps that from surfacing as an uncaught error.
      if (err?.message !== 'redirecting to login') {
        setStatus(statusNode, 'err', escapeHtml(err?.message || String(err)));
      }
    });
  </script>
</body>
</html>
