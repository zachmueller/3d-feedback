<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Projects · 3D models</title>
  <link rel="stylesheet" href="/app/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">3D models</div>
    <nav>
      <a href="/browse">Catalog</a>
      <a href="#feedback">Feedback</a>
      <a href="#" id="logout">Sign out</a>
    </nav>
  </header>

  <main>
    <div class="row">
      <div>
        <h1>Projects</h1>
        <p class="subtitle">
          Publish new revisions from the CLI with <code>tools/publish.sh</code>.
          Every revision keeps its own link and its own feedback.
        </p>
      </div>
      <div class="spacer"></div>
      <button id="refresh" class="btn secondary small">Refresh</button>
    </div>

    <div id="status" class="status"></div>

    <div id="projects" class="stack"></div>
    <div id="empty" class="empty hidden">
      No projects yet. Publish one with <code>tools/publish.sh model.glb --project my-part</code>.
    </div>
    <div id="loading" class="empty"><span class="spinner"></span> Loading…</div>
    <div id="projectsMore" class="more hidden">
      <span id="projectsCount" class="meta"></span>
      <button class="btn secondary small" data-act="more-projects">Load more</button>
    </div>

    <section id="feedback">
      <div class="row">
        <h2>Recent feedback</h2>
        <div class="spacer"></div>
        <button id="refreshFeedback" class="btn secondary small">Refresh</button>
      </div>
      <div id="feedbackList" class="stack"></div>
      <div id="feedbackEmpty" class="empty hidden">No feedback yet.</div>
      <div id="feedbackMore" class="more hidden">
        <span id="feedbackCount" class="meta"></span>
        <button class="btn secondary small" data-act="more-feedback">Load more</button>
      </div>
    </section>
  </main>

  <script type="module">
    import {
      requireAuth, api, getConfig, logout, canonicalizeOrigin, startTokenRefresh,
      HOME, el, setStatus, copyText, escapeHtml, fmtDate,
    } from '/app/app.js';
    import {
      projectCard, updateMore, replaceRevisionList,
    } from '/app/cards.js';

    // Every card on this page carries its mutating buttons; /browse renders the
    // same cards without them.
    const CONTROLS = { controls: true };

    const projectsNode = el('projects');
    const statusNode = el('status');
    const emptyNode = el('empty');
    const loadingNode = el('loading');
    const feedbackNode = el('feedbackList');
    const feedbackEmpty = el('feedbackEmpty');

    let cfg;

    // Both lists are paged: the first load is one page, and "Load more" appends.
    // Nothing here asks for everything, so the page stays the same size to load
    // whether there are five projects or five hundred.
    const PROJECT_PAGE = 20;
    const FEEDBACK_PAGE = 25;
    // Matches MAX_REVISION_LIMIT in the handler: what "Show all" asks for.
    const ALL_REVISIONS = 500;

    const projectPage = { loaded: 0, total: 0 };
    const feedbackPage = { loaded: 0, total: 0 };

    el('logout').addEventListener('click', (e) => { e.preventDefault(); logout(); });
    el('refresh').addEventListener('click', () => loadProjects());
    el('refreshFeedback').addEventListener('click', () => loadFeedback());

    /**
     * One page of projects. `append` adds the next page instead of replacing the
     * list, so "Load more" does not re-render (or re-fetch) what is already there.
     */
    async function loadProjects({ append = false } = {}) {
      loadingNode.classList.remove('hidden');
      try {
        // A reload after an edit keeps however many pages were open, so the view
        // does not snap back to the first page under the user.
        const offset = append ? projectPage.loaded : 0;
        const limit = append
          ? PROJECT_PAGE
          : Math.max(PROJECT_PAGE, projectPage.loaded || PROJECT_PAGE);
        const { projects, total } = await api('list', { offset, limit });
        loadingNode.classList.add('hidden');

        const html = projects.map((p) => projectCard(cfg, p, CONTROLS)).join('');
        if (append) {
          projectsNode.insertAdjacentHTML('beforeend', html);
          projectPage.loaded += projects.length;
        } else {
          projectsNode.innerHTML = html;
          projectPage.loaded = projects.length;
        }
        projectPage.total = total;
        emptyNode.classList.toggle('hidden', projectPage.total > 0);
        updateMore(el('projectsMore'), el('projectsCount'), projectPage, 'projects');
      } catch (err) {
        loadingNode.classList.add('hidden');
        // A 403 here means a valid session with the wrong role — a read-only
        // account that followed a bookmark. Send it to the page it can use rather
        // than leaving it on an admin page full of errors.
        if (err?.status === 403) {
          window.location.assign(HOME);
          return;
        }
        setStatus(statusNode, 'err', escapeHtml(err.message || String(err)));
      }
    }

    function commentCard(c) {
      return `
          <div class="card comment">
            <div class="revhead">
              <strong>${escapeHtml(c.name || 'Anonymous')}</strong>
              <span class="meta">${escapeHtml(fmtDate(c.at))}</span>
              <span class="spacer"></span>
              <a href="${escapeHtml(c.url)}" target="_blank" rel="noopener" class="mono">/${escapeHtml(c.project)}/${c.revision}</a>
            </div>
            <div class="ctext">${escapeHtml(c.text)}</div>
          </div>`;
    }

    /**
     * One page of feedback. The page is counted in *revision threads*, not
     * comments — that is what lets the API read only a page's worth of threads
     * instead of every thread on every load — so a page can bring back more
     * comments than the page size.
     */
    async function loadFeedback({ append = false } = {}) {
      try {
        const offset = append ? feedbackPage.loaded : 0;
        const limit = append
          ? FEEDBACK_PAGE
          : Math.max(FEEDBACK_PAGE, feedbackPage.loaded || FEEDBACK_PAGE);
        const { items, total, limit: served } = await api('feedback', { offset, limit });
        // Threads consumed, which is what `total` counts — not items rendered.
        const consumed = Math.min(served, Math.max(total - offset, 0));

        if (append) {
          feedbackNode.insertAdjacentHTML('beforeend', items.map(commentCard).join(''));
          feedbackPage.loaded += consumed;
        } else {
          feedbackNode.innerHTML = items.map(commentCard).join('');
          feedbackPage.loaded = consumed;
        }
        feedbackPage.total = total;
        feedbackEmpty.classList.toggle('hidden', total > 0);
        updateMore(el('feedbackMore'), el('feedbackCount'), feedbackPage, 'threads');
      } catch (err) {
        setStatus(statusNode, 'err', escapeHtml(err.message || String(err)));
      }
    }

    // One delegated handler for every button in both lists.
    document.addEventListener('click', async (event) => {
      const button = event.target.closest('[data-act]');
      if (!button) return;
      const { act, slug, rev, url } = button.dataset;

      try {
        if (act === 'copy') {
          const ok = await copyText(url);
          const original = button.textContent;
          button.textContent = ok ? 'Copied!' : 'Copy failed';
          setTimeout(() => { button.textContent = original; }, 1500);
          return;
        }
        if (act === 'toggle-note') {
          // The button sits immediately after its own .note, both children of the
          // revision's <li>, so this cannot reach a neighbouring revision's note.
          const note = button.parentElement?.querySelector('.note');
          if (note) {
            const collapsed = note.classList.toggle('collapsed');
            button.textContent = collapsed ? 'Show more' : 'Show less';
            button.setAttribute('aria-expanded', String(!collapsed));
          }
          return;
        }
        if (act === 'more-projects') {
          button.disabled = true;
          try { await loadProjects({ append: true }); } finally { button.disabled = false; }
          return;
        }
        if (act === 'more-feedback') {
          button.disabled = true;
          try { await loadFeedback({ append: true }); } finally { button.disabled = false; }
          return;
        }
        if (act === 'all-revs') {
          // Fetch this one project's full revision list and swap only its card,
          // leaving the rest of the page — and the other cards' windows — alone.
          button.disabled = true;
          try {
            const { projects } = await api('list', { project: slug, revisionLimit: ALL_REVISIONS });
            if (projects[0]) replaceRevisionList(cfg, projectsNode, projects[0], CONTROLS);
          } finally {
            // The button is gone once the swap succeeds; re-enable it if it isn't,
            // so a failed fetch leaves something to click again.
            if (button.isConnected) button.disabled = false;
          }
          return;
        }
        if (act === 'title') {
          const title = prompt(`Title for "${slug}"`);
          if (title === null) return;
          await api('edit', { project: slug, title });
          await loadProjects();
          return;
        }
        if (act === 'notes') {
          const notes = prompt(`Notes for ${slug} rev ${rev}`);
          if (notes === null) return;
          await api('edit', { project: slug, revision: Number(rev), notes });
          await loadProjects();
          return;
        }
        if (act === 'del-rev') {
          if (!confirm(`Delete ${slug} rev ${rev}? Its link and feedback go away for good.`)) return;
          await api('delete', { project: slug, revision: Number(rev) });
          setStatus(statusNode, 'ok', `Deleted ${escapeHtml(slug)} rev ${escapeHtml(rev)}.`);
          await loadProjects();
          return;
        }
        if (act === 'del-project') {
          if (!confirm(`Delete the whole "${slug}" project — every revision and all feedback?`)) return;
          await api('delete', { project: slug });
          setStatus(statusNode, 'ok', `Deleted ${escapeHtml(slug)}.`);
          await Promise.all([loadProjects(), loadFeedback()]);
          return;
        }
      } catch (err) {
        setStatus(statusNode, 'err', escapeHtml(err.message || String(err)));
      }
    });

    (async () => {
      // One origin, one token store — before requireAuth, or a signed-in user
      // arriving on the CloudFront domain gets sent through a needless sign-in.
      if (await canonicalizeOrigin()) return;
      await requireAuth();
      cfg = await getConfig();
      // Keep the token fresh while this tab is open, so coming back to a page
      // left open overnight is not the moment a refresh turns out to be needed.
      startTokenRefresh();
      await Promise.all([loadProjects(), loadFeedback()]);
    })().catch((err) => {
      // requireAuth rejects on purpose after starting the redirect to /login;
      // swallowing it here keeps that from surfacing as an uncaught error.
      if (err?.message !== 'redirecting to login') {
        setStatus(statusNode, 'err', escapeHtml(err?.message || String(err)));
      }
    });
  </script>
</body>
</html>
